<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NepAlert — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
    .login-wrap { width:100%; max-width:400px; padding:20px; }
    .login-card { background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius); padding:36px 32px; box-shadow:var(--shadow-lg); }
    .login-logo { text-align:center; margin-bottom:28px; }
    .login-logo .logo-icon { font-size:40px; margin-bottom:8px; }
    .login-logo .logo-icon-box { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; background:#2563eb; border-radius:14px; margin-bottom:12px; }
    .login-logo .logo-icon-box svg { width:34px; height:34px; fill:#fff; }
    .login-logo h1 { font-size:22px; font-weight:800; margin:0 0 4px; }
    .login-logo p { font-size:12px; color:var(--text-muted); margin:0; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-group input {
      width:100%; background:var(--bg-secondary); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text-primary); font-family:inherit;
      font-size:14px; padding:10px 12px; outline:none; box-sizing:border-box;
      transition:border-color 0.2s;
    }
    .form-group input:focus { border-color:var(--accent-blue); }
    .btn-login {
      width:100%; padding:12px; font-size:14px; font-weight:700;
      background:var(--accent-blue); color:#fff; border:none;
      border-radius:var(--radius-sm); cursor:pointer; margin-top:8px;
      transition:opacity 0.2s;
    }
    .btn-login:hover { opacity:0.9; }
    .btn-login:disabled { opacity:0.5; cursor:not-allowed; }
    .error-msg { color:var(--accent-red); font-size:12px; margin-top:12px; text-align:center; min-height:18px; }
    .login-footer { text-align:center; margin-top:20px; font-size:11px; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon-box">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <h1>NepAlert</h1>
        <p>Flood & Landslide Detection System</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-login" id="login-btn">Sign In</button>
        <div class="error-msg" id="error-msg"></div>
      </form>

      <div class="login-footer">AI-based disaster detection system</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    // DEV BYPASS: skip login once
    Auth.save('dev-token', { name: 'NepAlert', email: 'dev@nepalert.com' });
    window.location.href = 'index.html';
    const footer = document.querySelector('.login-footer');
    const errorEl = document.getElementById('error-msg');
    const submitBtn = document.getElementById('login-btn');

    // Inject name field and toggle link
    const nameGroup = document.createElement('div');
    nameGroup.className = 'form-group';
    nameGroup.style.display = 'none';
    nameGroup.id = 'name-group';
    nameGroup.innerHTML = `
      <label>Name</label>
      <input type="text" id="name" placeholder="Full name" autocomplete="name" />
    `;
    form.insertBefore(nameGroup, form.firstChild);

    const toggleWrap = document.createElement('div');
    toggleWrap.style.textAlign = 'center';
    toggleWrap.style.marginTop = '12px';
    toggleWrap.innerHTML = `
      <a href="#" id="toggle-auth">Create an account</a>
    `;
    form.appendChild(toggleWrap);

    let isRegister = false;

    document.getElementById('toggle-auth').addEventListener('click', (ev) => {
      ev.preventDefault();
      isRegister = !isRegister;
      nameGroup.style.display = isRegister ? '' : 'none';
      submitBtn.textContent = isRegister ? 'Register' : 'Sign In';
      document.getElementById('toggle-auth').textContent = isRegister ? 'Back to sign in' : 'Create an account';
      errorEl.textContent = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name')?.value?.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = isRegister ? 'Registering…' : 'Signing in…';
      errorEl.textContent = '';

      try {
        if (isRegister) {
          if (!name) {
            throw new Error('Name is required for registration');
          }
          if (password.length < 8) {
            throw new Error('Password must be at least 8 characters');
          }
          const res = await apiRegister(name, email, password);
          if (res?.success) {
            Auth.save(res.token, res.data.user);
            window.location.href = 'index.html';
            return;
          } else if (res?.errors && res.errors.length) {
            // express-validator returns an array of errors
            throw new Error(res.errors[0].msg || res.errors[0].message || 'Registration failed');
          } else {
            throw new Error(res?.message || 'Registration failed');
          }
        } else {
          const res = await apiLogin(email, password);
          if (res?.success) {
            Auth.save(res.token, res.data.user);
            window.location.href = 'index.html';
            return;
          } else if (res?.errors && res.errors.length) {
            throw new Error(res.errors[0].msg || res.errors[0].message || 'Invalid email or password.');
          } else {
            throw new Error(res?.message || 'Invalid email or password.');
          }
        }
      } catch (err) {
        // Network errors from fetch often appear as 'Failed to fetch'
        if (err && (err.message === 'Failed to fetch' || err.message === 'NetworkError when attempting to fetch resource.')) {
          errorEl.textContent = 'Cannot reach server. Is the backend running?';
        } else {
          errorEl.textContent = err?.message || 'An error occurred';
        }
        submitBtn.disabled = false;
        submitBtn.textContent = isRegister ? 'Register' : 'Sign In';
      }
    });
  </script>
</body>
</html>
