<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NepAlert — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="login-page-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon-box">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <h1>NepAlert</h1>
        <p>Flood & Landslide Detection System</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-input" placeholder="Enter your email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <div class="form-group">
          <label>Province</label>
          <select id="province" class="form-select">
            <option value="">Select province</option>
          </select>
        </div>
        <div class="form-group">
          <label>District</label>
          <select id="district" class="form-select" disabled>
            <option value="">Select district</option>
          </select>
        </div>
        <button type="submit" class="btn-login" id="login-btn">Sign In</button>
        <div class="error-msg" id="error-msg"></div>
      </form>

      <div class="login-footer">AI-based disaster detection system</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nepal-districts.js"></script>
  <script>
    const form = document.getElementById('login-form');

    // Redirect if already logged in

    const errorEl = document.getElementById('error-msg');
    const submitBtn = document.getElementById('login-btn');

    // Inject name field and toggle link
    const nameGroup = document.createElement('div');
    nameGroup.className = 'form-group';
    nameGroup.style.display = 'none';
    nameGroup.id = 'name-group';
    nameGroup.innerHTML = `
      <label>Name</label>
      <input type="text" id="name" class="form-input" placeholder="Full name" autocomplete="name" />
    `;
    form.insertBefore(nameGroup, form.firstChild);

    const toggleWrap = document.createElement('div');
    toggleWrap.className = 'auth-toggle-wrap';
    toggleWrap.innerHTML = `
      <a href="#" id="toggle-auth">Create an account</a>
    `;
    form.appendChild(toggleWrap);

    let isRegister = false;

    const provinceSel = document.getElementById('province');
    const districtSel = document.getElementById('district');

    if (provinceSel && window.NEPAL_PROVINCES) {
      window.NEPAL_PROVINCES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        provinceSel.appendChild(opt);
      });

      provinceSel.addEventListener('change', () => {
        const prov = provinceSel.value;
        districtSel.innerHTML = '<option value="">Select district</option>';
        if (!prov) { districtSel.disabled = true; return; }
        districtSel.disabled = false;
        if (window.populateDistrictSelect) window.populateDistrictSelect(districtSel, prov);
      });
    }

    document.getElementById('toggle-auth').addEventListener('click', (ev) => {
      ev.preventDefault();
      isRegister = !isRegister;
      nameGroup.style.display = isRegister ? '' : 'none';
      submitBtn.textContent = isRegister ? 'Register' : 'Sign In';
      document.getElementById('toggle-auth').textContent = isRegister ? 'Back to sign in' : 'Create an account';
      errorEl.textContent = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name')?.value?.trim();
      const district = districtSel?.value || '';
      const province = provinceSel?.value || '';

      submitBtn.disabled = true;
      submitBtn.textContent = isRegister ? 'Registering…' : 'Signing in…';
      errorEl.textContent = '';

      try {
        if (isRegister) {
          if (!name) {
            throw new Error('Name is required for registration');
          }
          if (password.length < 8) {
            throw new Error('Password must be at least 8 characters');
          }
          const res = await apiRegister(name, email, password, undefined, undefined, { district, province });
          if (res?.success) {
            Auth.save(res.token, res.data.user);
            window.location.href = 'index.html';
            return;
          } else if (res?.errors && res.errors.length) {
            throw new Error(res.errors[0].msg || res.errors[0].message || 'Registration failed');
          } else {
            throw new Error(res?.message || 'Registration failed');
          }
        } else {
          const res = await apiLogin(email, password, { district, province });
          if (res?.success) {
            Auth.save(res.token, res.data.user);
            window.location.href = 'index.html';
            return;
          } else if (res?.errors && res.errors.length) {
            throw new Error(res.errors[0].msg || res.errors[0].message || 'Invalid email or password.');
          } else {
            throw new Error(res?.message || 'Invalid email or password.');
          }
        }
      } catch (err) {
        // Network errors from fetch often appear as 'Failed to fetch'
        if (err && (err.message === 'Failed to fetch' || err.message === 'NetworkError when attempting to fetch resource.')) {
          errorEl.textContent = 'Cannot reach server. Is the backend running?';
        } else {
          errorEl.textContent = err?.message || 'An error occurred';
        }
        submitBtn.disabled = false;
        submitBtn.textContent = isRegister ? 'Register' : 'Sign In';
      }
    });
  </script>
</body>
</html>
