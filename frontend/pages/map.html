<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nepal Map — NepAlert</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .map-page-container { height: calc(100vh - var(--header-height) - 120px); }
    #full-map { width: 100%; height: 100%; border-radius: var(--radius); }
    .map-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .map-filter-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); cursor: pointer; transition: all var(--transition);
    }
    .map-filter-btn.active, .map-filter-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-light); }
    .map-filter-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); }
  </style>
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🔔</div>
      <div>
        <div class="logo-text">NepAlert</div>
        <div class="logo-sub">Flood & Landslide System</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a href="../index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="alerts.html" class="nav-item"><span class="nav-icon">🚨</span> Active Alerts <span class="nav-badge" id="nav-alert-badge" style="display:none;"></span></a>
      <a href="map.html" class="nav-item active"><span class="nav-icon">🗺️</span> Nepal Map</a>
      <div class="nav-section-label">Analysis</div>
      <a href="predictions.html" class="nav-item"><span class="nav-icon">🔮</span> Predictions</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📋</span> Reports</a>
    </nav>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <div>
          <div class="page-title">Nepal Map</div>
          <div class="page-subtitle">Real-time flood & landslide event visualization</div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-indicator"><div class="status-dot"></div> Live</div>
        <button class="header-btn">🔔<span class="notif-badge" style="display:none;"></span></button>
        <div class="avatar">ND</div>
      </div>
    </header>

    <main class="page-content">

      <div class="map-controls fade-in fade-in-delay-1">
        <button class="map-filter-btn active">🌐 All Events</button>
        <button class="map-filter-btn">🌊 Flood Only</button>
        <button class="map-filter-btn">⛰️ Landslide Only</button>
        <button class="map-filter-btn">🟠 High</button>
        <button class="map-filter-btn">🟡 Medium & Low</button>
      </div>

      <div class="card map-page-container fade-in fade-in-delay-2" style="padding:0;overflow:hidden;">
        <div id="full-map"></div>
        <div class="map-legend" style="bottom:16px;left:16px;">
          <div class="legend-title">Event Type</div>
          <div class="legend-item"><span style="font-size:14px;">🌊</span> Flood</div>
          <div class="legend-item"><span style="font-size:14px;">⛰️</span> Landslide</div>
          <div style="margin-top:8px;" class="legend-title">Severity</div>
          <div class="legend-item"><div class="legend-dot" style="background:#f97316;"></div> High</div>
          <div class="legend-item"><div class="legend-dot" style="background:#eab308;"></div> Medium</div>
          <div class="legend-item"><div class="legend-dot" style="background:#22c55e;"></div> Low</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/api.js"></script>
<script>requireAuth();</script>
<script src="../js/live-data.js"></script>
<script src="../js/map.js"></script>
<script src="../js/interactions.js"></script>
<script>
  initMap('full-map');

  let currentFilter = 'all';

  function getFilteredMarkers() {
    const markers = typeof DATA !== 'undefined' ? DATA.mapMarkers : [];
    if (currentFilter === 'flood') return markers.filter(m => m.type === 'flood');
    if (currentFilter === 'landslide') return markers.filter(m => m.type === 'landslide');
    if (currentFilter === 'high') return markers.filter(m => m.severity === 'high');
    if (currentFilter === 'medium-low') return markers.filter(m => m.severity === 'moderate' || m.severity === 'medium' || m.severity === 'low');
    return markers;
  }

  function renderMapMarkers() {
    mapInstance.eachLayer(layer => { if (layer instanceof L.Marker) mapInstance.removeLayer(layer); });
    const markers = getFilteredMarkers();
    markers.forEach(m => {
      if (m.coords && m.coords[0] && m.coords[1]) {
        addMarker(m);
      }
    });
    showToast(`Showing ${markers.length} event(s)`, 'info', 1500);
  }

  function applyMapFilter(btn) {
    document.querySelectorAll('.map-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const label = btn.textContent.trim();

    if (label.includes('Flood Only'))      currentFilter = 'flood';
    else if (label.includes('Landslide'))  currentFilter = 'landslide';
    else if (label.includes('High'))       currentFilter = 'high';
    else if (label.includes('Medium'))     currentFilter = 'medium-low';
    else                                   currentFilter = 'all';

    renderMapMarkers();
  }

  document.querySelectorAll('.map-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => applyMapFilter(btn));
  });

  async function refreshMapData() {
    try {
      await loadDashboardData();
      renderMapMarkers();
    } catch (err) {
      console.error('Map data load failed:', err);
    }
  }

  refreshMapData();
  setInterval(refreshMapData, 15000);
</script>
</body>
</html>
